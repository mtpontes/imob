<div [class.logged-out]="!isLoggedIn()" class="app-container">
  
  <!-- Header Geral (Oculto em Login) -->
  <header class="app-header glass" *ngIf="isLoggedIn()">
    <div class="header-brand">
      <div class="brand-logo" routerLink="/properties">
        <img src="icons/icon-96x96.png?v=1" class="brand-logo-img" alt="ImobApp Logo" />
        <span>ImobApp</span>
      </div>
      <div class="workspace-badge desktop-only" id="current-workspace-badge">
        <lucide-icon name="briefcase"></lucide-icon>
        <span id="workspace-name-display">Workspace: {{ workspaceName }}</span>
      </div>
    </div>
    
    <div class="header-actions">
      <div class="user-profile-menu-container">
        <!-- Perfil clicável -->
        <div class="user-profile clickable" (click)="toggleProfileMenu($event)" id="user-profile-toggle">
          <div class="avatar" id="user-avatar-initials">{{ userInitials }}</div>
          <div class="user-info desktop-only">
            <span class="user-email" id="user-email-display">{{ userEmail }}</span>
          </div>
          <lucide-icon name="chevron-down" class="chevron-profile desktop-only"></lucide-icon>
        </div>

        <!-- Backdrop invisível para fechar o menu ao clicar fora -->
        <div class="dropdown-backdrop" *ngIf="isProfileMenuOpen" (click)="closeProfileMenu()"></div>

        <!-- Menu Dropdown de Perfil -->
        <div class="profile-dropdown glass" *ngIf="isProfileMenuOpen" id="profile-dropdown-menu">
          <div class="dropdown-user-details mobile-only">
            <span class="dropdown-user-email">{{ userEmail }}</span>
          </div>
          
          <div class="dropdown-workspace mobile-only">
            <lucide-icon name="briefcase"></lucide-icon>
            <span>Workspace: {{ workspaceName }}</span>
          </div>
          
          <div class="dropdown-divider mobile-only"></div>
          
          <button (click)="logout()" id="btn-logout" class="dropdown-item btn-logout-item">
            <lucide-icon name="log-out"></lucide-icon>
            <span>Sair</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Barra de Navegação Inferior (Foco em Mobile/PWA) -->
  <nav class="app-nav glass" *ngIf="isLoggedIn()">
    <button class="nav-item" routerLink="/properties" routerLinkActive="active" id="nav-item-properties">
      <lucide-icon name="home"></lucide-icon>
      <span>Imoveis</span>
    </button>
    <button class="nav-item" routerLink="/roteiros" routerLinkActive="active" id="nav-item-protocols">
      <lucide-icon name="clipboard-list"></lucide-icon>
      <span>Roteiros</span>
    </button>
  </nav>

  <!-- Main Content Area -->
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

</div>
