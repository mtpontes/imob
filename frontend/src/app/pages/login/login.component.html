<section class="login-section">
  <div class="login-card-wrapper">
    <div class="login-logo-area animate-cascade delay-1">
      <img src="icons/icon-192x192.png?v=1" class="login-logo-img" alt="ImobApp Logo" />
      <h1>Imob<span>App</span></h1>
      <p>Plataforma de Avaliacao de Imoveis</p>
    </div>
    
    <div class="login-card glass animate-cascade delay-2">
      <h2>Bem-vindo de volta</h2>
      <p class="subtitle">Acesse sua conta para gerenciar visitas e avaliacoes</p>
      
      <div *ngIf="errorMessage" class="alert error-alert" id="error-message-banner" style="margin-bottom: 1.5rem; padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255, 51, 102, 0.2); background: rgba(255, 51, 102, 0.1); color: #ff3366; font-size: 0.85rem;">
        {{ errorMessage }}
      </div>

      <div class="login-actions" style="display: flex; flex-direction: column; gap: 1rem;">
        <button type="button" (click)="loginWithGoogle()" [disabled]="loading" class="btn btn-google btn-block" id="btn-google-login">
          <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px;">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          <span>Entrar com o Google</span>
        </button>

        <button type="button" (click)="bypassLogin()" [disabled]="loading" class="btn btn-outline btn-block" id="btn-bypass-login">
          <span>Acesso Rapido (Bypass)</span>
          <lucide-icon name="zap"></lucide-icon>
        </button>
      </div>
      
      <div class="login-footer">
        <p>Ambiente seguro e serverless de alta performance.</p>
      </div>
    </div>
    
    <!-- Dicas de multi-tenant -->
    <div class="demo-info-box glass animate-cascade delay-3">
      <lucide-icon name="info"></lucide-icon>
      <span><strong>Dica de Teste:</strong> O login via Google ou Bypass criará seu workspace isolado automaticamente!</span>
    </div>
  </div>
</section>
