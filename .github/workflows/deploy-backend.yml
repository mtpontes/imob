name: Deploy Backend & Infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Selecione o ambiente de deploy (dev ou prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  build:
    name: Build Native Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Quarkus Native Build
        id: cache-backend
        uses: actions/cache@v4
        with:
          path: backend/target/function.zip
          key: ${{ runner.os }}-quarkus-native-${{ hashFiles('backend/pom.xml', 'backend/src/**') }}

      - name: Build Native Image via Docker
        if: steps.cache-backend.outputs.cache-hit != 'true'
        run: |
          chmod +x backend/mvnw
          cd backend && ./mvnw clean package -Pnative -DskipTests -Dquarkus.native.container-build=true

      - name: Upload Lambda Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-function
          path: backend/target/function.zip
          retention-days: 1

  deploy:
    name: Deploy AWS SAM
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Lambda Artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-function
          path: backend/target

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: SAM Deploy
        run: |
          sam deploy \
            --template-file backend/template.yaml \
            --stack-name imob-app-infra-${{ github.event.inputs.environment || 'dev' }} \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
