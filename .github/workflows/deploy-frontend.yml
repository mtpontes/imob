name: Deploy Frontend

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Selecione o ambiente de deploy (dev ou prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'master' && 'prod' || 'dev') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Fetch API Gateway URL and Cognito Outputs from AWS SAM Stack
        id: fetch_aws_outputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV_NAME="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "master" ]; then
            ENV_NAME="prod"
          else
            ENV_NAME="dev"
          fi
          STACK_NAME="imob-app-infra-$ENV_NAME"
          
          # Consulta a stack CloudFormation completa em formato JSON
          STACK_JSON=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --output json)
          
          # Extrai os outputs usando jq
          API_URL=$(echo "$STACK_JSON" | jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="ApiUrl") | .OutputValue')
          USER_POOL_ID=$(echo "$STACK_JSON" | jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="UserPoolId") | .OutputValue')
          USER_POOL_CLIENT_ID=$(echo "$STACK_JSON" | jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="UserPoolClientId") | .OutputValue')
          COGNITO_DOMAIN=$(echo "$STACK_JSON" | jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="CognitoDomain") | .OutputValue')
          
          if [ -z "$API_URL" ] || [ "$API_URL" = "null" ]; then
            echo "ERROR: Could not fetch API Gateway URL"
            exit 1
          fi
          
          # Exporta para as variaveis de ambiente do Github Actions
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "COGNITO_USER_POOL_ID=$USER_POOL_ID" >> $GITHUB_ENV
          echo "COGNITO_USER_POOL_CLIENT_ID=$USER_POOL_CLIENT_ID" >> $GITHUB_ENV
          echo "COGNITO_DOMAIN=$COGNITO_DOMAIN" >> $GITHUB_ENV
          
          echo "AWS Outputs obtidos com sucesso:"
          echo "API_URL: $API_URL"
          echo "UserPoolId: $USER_POOL_ID"
          echo "UserPoolClientId: $USER_POOL_CLIENT_ID"
          echo "CognitoDomain: $COGNITO_DOMAIN"

      - name: Generate vercel.json with dynamic rewrites
        run: |
          cat <<EOF > frontend/vercel.json
          {
            "rewrites": [
              {
                "source": "/api/(.*)",
                "destination": "${{ env.API_URL }}/api/\$1"
              },
              {
                "source": "/(.*)",
                "destination": "/index.html"
              }
            ]
          }
          EOF
          
          echo "Generated vercel.json content:"
          cat frontend/vercel.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NG_APP_COGNITO_USER_POOL_ID: ${{ env.COGNITO_USER_POOL_ID }}
          NG_APP_COGNITO_CLIENT_ID: ${{ env.COGNITO_USER_POOL_CLIENT_ID }}
          NG_APP_COGNITO_DOMAIN: ${{ env.COGNITO_DOMAIN }}
        run: vercel build --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
