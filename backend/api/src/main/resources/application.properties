# Configuracoes gerais do Quarkus
quarkus.http.root-path=/
# Aumenta o limite do tamanho de cabecalhos para evitar erro HTTP 431 (comum com tokens JWT do Cognito ou excesso de cookies no localhost)
quarkus.http.limits.max-header-size=65536
quarkus.http.limits.max-header-list-size=65536
quarkus.devservices.enabled=false

# CORS configuration
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,https://.*.vercel.app
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-User-Email

# DynamoDB Configuration
quarkus.dynamodb.aws.region=us-east-1
# S3 Configuration
quarkus.s3.aws.region=us-east-1

# Variaveis de ambiente customizadas para a aplicacao
imob.workspaces.table.name=${IMOB_WORKSPACES_TABLE_NAME:ImobWorkspaces}
imob.properties.table.name=${IMOB_PROPERTIES_TABLE_NAME:ImobProperties}
imob.evaluations.table.name=${IMOB_EVALUATIONS_TABLE_NAME:ImobEvaluations}
imob.scripts.table.name=${IMOB_SCRIPTS_TABLE_NAME:ImobScripts}
imob.invites.table.name=${IMOB_INVITES_TABLE_NAME:ImobInvites}
imob.user-profiles.table.name=${IMOB_USER_PROFILES_TABLE_NAME:ImobUserProfiles}
imob.user-workspace-relations.table.name=${IMOB_USER_WORKSPACE_RELATIONS_TABLE_NAME:ImobUserWorkspaceRelations}
imob.bucket.name=${IMOB_BUCKET_NAME:imob-app-bucket}
imob.mock.auth=${IMOB_MOCK_AUTH:false}
imob.app.url=${IMOB_APP_URL:http://localhost:4200}

# Perfil de Desenvolvimento Local (%dev)
# Credenciais no formato AWS valido (AKIA + 16 chars): DynamoDB Local 2.x rejeita formatos invalidos
%dev.quarkus.dynamodb.endpoint-override=http://localhost:8000
%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=AKIAIOSFODNN7EXAMPLE
