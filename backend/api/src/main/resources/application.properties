%test.quarkus.s3.endpoint-override=http://localhost:4566
%test.quarkus.s3.aws.credentials.type=static
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=AKIAIOSFODNN7EXAMPLE
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
%test.quarkus.s3.path-style-access=true

%test.imob.table.name=ImobAppDB
%test.imob.bucket.name=imob-app-bucket
%test.quarkus.dynamodb.devservices.enabled=false
%test.quarkus.s3.devservices.enabled=false
%test.imob.mock.auth=false
