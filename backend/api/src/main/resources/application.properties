# Configuracoes gerais do Quarkus
quarkus.http.root-path=/
# Aumenta o limite do tamanho de cabecalhos para evitar erro HTTP 431 (comum com tokens JWT do Cognito ou excesso de cookies no localhost)
quarkus.http.limits.max-header-size=65536
quarkus.http.limits.max-header-list-size=65536
quarkus.devservices.enabled=false

# CORS configuration
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,https://.*.vercel.app
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-User-Email

# DynamoDB Configuration
quarkus.dynamodb.aws.region=us-east-1
# S3 Configuration
quarkus.s3.aws.region=us-east-1

# Variaveis de ambiente customizadas para a aplicacao
imob.table.name=${IMOB_TABLE_NAME:ImobAppDB}
imob.bucket.name=${IMOB_BUCKET_NAME:imob-app-bucket}
imob.mock.auth=${IMOB_MOCK_AUTH:false}

# Perfil de Desenvolvimento Local (%dev)
# Credenciais no formato AWS valido (AKIA + 16 chars): DynamoDB Local 2.x rejeita formatos invalidos
%dev.quarkus.dynamodb.endpoint-override=http://localhost:8000
%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=AKIAIOSFODNN7EXAMPLE
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

%dev.quarkus.s3.endpoint-override=http://localhost:4566
%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=AKIAIOSFODNN7EXAMPLE
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
%dev.quarkus.s3.path-style-access=true

%dev.imob.table.name=ImobAppDB
%dev.imob.bucket.name=imob-app-bucket
%dev.quarkus.dynamodb.devservices.enabled=false
%dev.quarkus.s3.devservices.enabled=false
%dev.imob.mock.auth=false

# Perfil de Teste (%test)
%test.quarkus.dynamodb.endpoint-override=http://localhost:8000
%test.quarkus.dynamodb.aws.credentials.type=static
%test.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=AKIAIOSFODNN7EXAMPLE
