%dev.quarkus.s3.path-style-access=true

%dev.imob.workspaces.table.name=ImobWorkspaces
%dev.imob.properties.table.name=ImobProperties
%dev.imob.evaluations.table.name=ImobEvaluations
%dev.imob.scripts.table.name=ImobScripts
%dev.imob.invites.table.name=ImobInvites
%dev.imob.user-profiles.table.name=ImobUserProfiles
%dev.imob.user-workspace-relations.table.name=ImobUserWorkspaceRelations
%dev.imob.bucket.name=imob-app-bucket
%dev.quarkus.dynamodb.devservices.enabled=false
%dev.quarkus.s3.devservices.enabled=false
%dev.imob.mock.auth=false
%dev.imob.app.url=http://localhost:4200

